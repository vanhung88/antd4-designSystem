name: CI (Lint / Types / Test)

on:
  pull_request:
    branches: [main, dev, sit]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Type Check
        run: yarn typecheck

      - name: Unit Tests
        run: npm test --if-present -- --ci --reporters=default --watch=false
